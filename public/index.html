

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub | Discover Events</title>

    <!-- Connect shared stylesheet located inside public/css -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<!-- Main navigation bar -->
<nav class="navbar">

    <!-- EventHub logo -->
    <a href="index.html" class="logo">EventHub</a>

    <!-- Desktop navigation links -->
    <div class="nav-links desktop-only">
        <a href="index.html" class="nav-link active">Home</a>
        <a href="explore.html" class="nav-link">Explore Events</a>
        <a href="host.html" class="nav-link">Host Event</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
    </div>

    <!-- Desktop navigation actions -->
    <div class="nav-actions desktop-only">

        <!-- Theme toggle -->
        <button class="theme-toggle-btn" onclick="toggleTheme()">
            <span id="theme-icon">☀️</span>
            <span id="theme-text">Day Mode</span>
        </button>

        <!-- Login -->
        <a href="login.html" class="login-btn">LogIn</a>

        <!-- Sign Up -->
        <a href="signup.html" class="action-btn">Sign Up</a>

    </div>

    <!-- Mobile menu button -->
    <button
            class="mobile-toggle mobile-only"
            onclick="toggleMobileMenu()">
        ☰
    </button>

</nav>


<!-- Mobile navigation drawer -->
<div id="mobile-drawer" class="mobile-drawer mobile-only">

    <a href="index.html" class="nav-link">Home</a>

    <a href="explore.html" class="nav-link">
        Explore Events
    </a>

    <a href="host.html" class="nav-link">
        Host Event
    </a>

    <a href="dashboard.html" class="nav-link">
        Dashboard
    </a>

    <hr style="background-color: var(--border-color); margin: 0.5rem 0;">

    <!-- Mobile theme toggle -->
    <button
            class="theme-toggle-btn"
            onclick="toggleTheme()">
        Toggle Theme
    </button>

    <!-- Mobile login -->
    <a
            href="login.html"
            class="login-btn"
            style="text-align: center;">
        LogIn
    </a>

    <!-- Mobile sign up -->
    <a href="signup.html" class="action-btn">
        Sign Up
    </a>

</div>


<!-- Main content -->
<main class="main-container">

    <!-- Hero section -->
    <section class="hero-section">

        <h1>Find. Book. Experience.</h1>

        <p>
            Discover tailored events happening around you,
            across your province, or nationwide.
        </p>

        <!-- Homepage search -->
        <div class="search-container">

            <input
                    type="text"
                    id="hero-search-input"
                    placeholder="Search events by keywords or topics...">

            <button
                    class="action-btn"
                    onclick="executeHeroSearch()">
                Search
            </button>

        </div>

    </section>


    <!-- Trending / Demo Events section -->
    <section style="margin-bottom: 3rem;">

        <h2>Trending Events</h2>

        <!--
            Event cards are dynamically inserted here
            by public/js/app.js.

            The 4 default demo cards will be added
            through app.js and will always appear here.
        -->
        <div
                class="events-grid"
                id="trending-grid">
        </div>

    </section>

</main>


<!-- Connect shared JavaScript -->
<script src="js/app.js"></script>

</body>

</html>
