<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub | Host Event</title>
    <-- Connect shared stylesheet -->
        <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="logo">EventHub</a>

        <div class="nav-links desktop-only">
            <a href="index.html" class="nav-link">Home</a>
            <a href="explore.html" class="nav-link">Explore Events</a>
            <a href="host.html" class="nav-links active">Host Event</a>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
        </div>

        <div class="nav-actions desktop-only">
            <button class="theme-toggle-btn" onclick="toggleTheme()">
                <span id="theme-icon">☀️</span> <span id="theme-text">Day Mode</span>
            </button>
            <a href="login.html" class="login-btn">LogIn</a>
            <a href="signup.html" class="action-btn">Sign Up</a>
        </div>
    </nav>

    <main class="main-container">
        <div class="form-card">
            <h2>Host a New Event</h2>
            <!-- Form triggering handlePostEvent JS function on submit -->
            <form id="post-event-form" onsubmit="handlePostEvent(event)">
                <div class="form-group">
                    <label>Event Title</label>
                    <input type="text" id="post-title" required placeholder="e.g. Cape Town Summer Festival">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="post-category" required>
                            <option value="Technology">Technology</option>
                            <option value="Music">Music</option>
                            <option value="Food">Food</option>
                            <option value="Sports">Sports</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ticket Price (ZAR)</label>
                        <input type="number" id="post-price" min="0" placeholder="0 For Free">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Area / Suburb</label>
                        <input type="text" id="post-area" required placeholder="e.g. Stellenbosch">
                    </div>
                    <div class="form-group">
                        <label>Province</label>
                        <select id="post-province" required>
                            <option value="Western Cape">Western Cape</option>
                            <option value="Gauteng">Gauteng</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="post-date" required">
                    </div>
                    <div class="form-group">
                        <label>Time</label>
                        <input type="time" id="post-time" required">
                    </div>
                </div>
                <div class="form-group">
                    <label>Event Description</label>
                    <textarea id="post-description" rows="4" required
                        placeholder="Provide detailed overview..."></textarea>
                </div>
                <button type="submit" class="action-btn" style="width: 100%;">Publish Event</button>
            </form>
        </div>
    </main>

    <!-- Connect shared client script -->
    <script src="js/app.js"></script>
</body>

</html>
