<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub | Admin Dashboard</title>

    <!-- Connect shared stylesheet located inside public/css -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<!-- Main navigation bar -->
<nav class="navbar">

    <!-- EventHub logo -->
    <a href="index.html" class="logo">EventHub</a>

    <!-- Desktop navigation links -->
    <div class="nav-links desktop-only">
        <a href="index.html" class="nav-link">Home</a>
        <a href="explore.html" class="nav-link">Explore Events</a>
        <a href="host.html" class="nav-link">Host Event</a>
        <a href="dashboard.html" class="nav-link active">Dashboard</a>
    </div>

    <!-- Desktop navigation actions -->
    <div class="nav-actions desktop-only">

        <!-- Theme toggle -->
        <button class="theme-toggle-btn" onclick="toggleTheme()">
            <span id="theme-icon">☀️</span>
            <span id="theme-text">Day Mode</span>
        </button>

        <!-- Login -->
        <a href="login.html" class="login-btn">LogIn</a>

        <!-- Sign Up -->
        <a href="signup.html" class="action-btn">Sign Up</a>

    </div>

    <!-- Mobile menu button -->
    <button
            class="mobile-toggle mobile-only"
            onclick="toggleMobileMenu()">
        ☰
    </button>

</nav>


<!-- Mobile navigation drawer -->
<div id="mobile-drawer" class="mobile-drawer mobile-only">

    <a href="index.html" class="nav-link">Home</a>

    <a href="explore.html" class="nav-link">
        Explore Events
    </a>

    <a href="host.html" class="nav-link">
        Host Event
    </a>

    <a href="dashboard.html" class="nav-link">
        Dashboard
    </a>

    <hr style="background-color: var(--border-color); margin: 0.5rem 0;">

    <!-- Mobile theme toggle -->
    <button
            class="theme-toggle-btn"
            onclick="toggleTheme()">
        Toggle Theme
    </button>

    <!-- Mobile login -->
    <a
            href="login.html"
            class="login-btn"
            style="text-align: center;">
        LogIn
    </a>

    <!-- Mobile sign up -->
    <a href="signup.html" class="action-btn">
        Sign Up
    </a>

</div>


<!-- Main content -->
<main class="main-container">

    <!-- Page header -->
    <div class="page-header">
        <h1>Admin Dashboard</h1>
        <p>A platform-wide overview of every event currently listed on EventHub.</p>
    </div>

    <!-- Results count, filled in by app.js -->
    <p class="results-meta" id="admin-results-meta" style="margin: 1rem 0;"></p>

    <!-- All events table -->
    <div class="dash-card" style="overflow-x: auto; padding: 0;">

        <table class="admin-table" id="admin-events-table">

            <thead>
                <tr>
                    <th>Event</th>
                    <th>Category</th>
                    <th>Organizer</th>
                    <th>Location</th>
                    <th>Province</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Price</th>
                    <th>Featured</th>
                </tr>
            </thead>

            <!--
                Table rows are dynamically inserted here
                by fetchAdminEvents() in public/js/app.js.
            -->
            <tbody id="admin-events-body">
            </tbody>

        </table>

    </div>

</main>


<!-- Connect shared JavaScript -->
<script src="js/app.js"></script>

</body>

</html>
