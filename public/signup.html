<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub | Create Account</title>
    <!-- Connect shared stylesheet -->
        <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="logo">EventHub</a>
    </nav>
    <main class="main-container">
        <div class="form-card auth-card">
            <h2>Create an Account</h2>
            <form id="signup-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signup-name" required placeholder="e.g. Jane Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signup-email" required placeholder="name@domain.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" required placeholder="*********">
                </div>
                <button type="submit" class="action-btn" style="width: 100%;">Create Accont</button>
                <p class="auth-switch">Already have an account? <a href="login.html">Log In</a></p>
            </form>
        </div>
    </main>
    <!-- Connect shared client script -->
    <script>
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            try {
                const response = await fetch('api/auth/signup', {
                   method : 'POST',
                    headers : {'Content-Type':'application/json'},
                    body : JSON.stringify({fullName, email, password})
                });

                const data = await response.json();

                if (data.success){
                    alert('Account created successfully!');
                    window.location.href = 'login.html';
                }else {
                    alert('Signup failed: ' + data.message);
                }
            } catch (err) {
                console.error('Error submitting form:', err);
                alert('Server error. Check your connection.');
            }
        });
    </script>
</body>

</html>
