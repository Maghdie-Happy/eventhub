<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub | Create Account</title>
    <-- Connect shared stylesheet -->
        <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="logo">EventHub</a>
    </nav>
    <main class="main-container">
        <div class="form-card auth-card">
            <h2>Create an Account</h2>
            <form onsubmit="handleSignUp(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signup-name" required placeholder="e.g. Jane Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signup-email" required placeholder="name@domain.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" required placeholder="*********">
                </div>
                <button type="submit" class="action-btn" style="width: 100%;">Create Accont</button>
                <p class="auth-switch">Already have an account? <a href="login.html">Log In</a></p>
            </form>
        </div>
    </main>
    <!-- Connect shared client script -->
    <script src="js/app.js"></script>
</body>

</html>
