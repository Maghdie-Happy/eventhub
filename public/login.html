<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub | Login</title>
    <-- connect shared stylesheet -->
        <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="logo">EventHub</a>
    </nav>
    <main class="main-container">
        <div class="form-card auth-card">
            <h2>Welcome Back</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" required placeholder="name@domain.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required placeholder="*********">
                </div>
                <button type="submit" class="action-btn" style="width: 100%;">LogIn</button>
                <p class="auth-switch">Don't have an account? <a href="signup.html">Sign Up</a></p>
            </form>
        </div>
    </main>
    <!-- Connect shared client script -->
    <script src="js/app.js"></script>
</body>

</html>
