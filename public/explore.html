<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub | Explore</title>
    <-- Connect shared stylesheet -->
        <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="logo">EventHub</a>

        <div class="nav-links desktop-only">
            <a href="index.html" class="nav-link">Home</a>
            <a href="explore.html" class="nav-link">Explore Events</a>
            <a href="host.html" class="nav-links active">Host Event</a>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
        </div>
        
<div class="nav-actions desktop-only">
            <button class="theme-toggle-btn" onclick="toggleTheme()">
                <span id="theme-icon">☀️</span> <span id="theme-text">Day Mode</span>
            </button>
            <a href="login.html" class="login-btn">LogIn</a>
            <a href="signup.html" class="action-btn">Sign Up</a>
        </div>
    </nav>
        
    <main class="main-container">
        <div class="page-header">
            <h1>Explore Events</h1>
            <p>Browse what's happening across Cape Town — from live music to workshops, markets to matchdays.</p>
        </div>
 
        <div class="explore-controls">
            <div class="form-group search-group">
                <input type="text" id="search-input" placeholder="Search events, artists, venues..." onkeyup="handleSearch(event)">
            </div>
 
            <div class="tab-switch" id="timeframe-switch">
                <button type="button" class="tab-btn active" data-value="upcoming" onclick="handleTimeframeChange(event)">Upcoming</button>
                <button type="button" class="tab-btn" data-value="past" onclick="handleTimeframeChange(event)">Past</button>
            </div>
 
            <div class="form-group">
                <select id="sort-select" onchange="handleSortChange(event)">
                    <option value="date">Sort: Date</option>
                    <option value="price">Sort: Price</option>
                    <option value="popularity">Sort: Popularity</option>
                </select>
            </div>
        </div>
 
        <ul class="filter-chips" id="category-chips">
            <li><button type="button" class="chip active" data-value="all" onclick="handleCategoryChange(event)">All</button></li>
            <li><button type="button" class="chip" data-value="music" onclick="handleCategoryChange(event)">Music</button></li>
            <li><button type="button" class="chip" data-value="workshop" onclick="handleCategoryChange(event)">Workshops</button></li>
            <li><button type="button" class="chip" data-value="sports" onclick="handleCategoryChange(event)">Sports</button></li>
            <li><button type="button" class="chip" data-value="market" onclick="handleCategoryChange(event)">Markets</button></li>
            <li><button type="button" class="chip" data-value="arts" onclick="handleCategoryChange(event)">Arts &amp; Theatre</button></li>
        </ul>
 
        <p class="results-meta" id="results-meta"></p>
 
        <div class="event-grid" id="event-grid">
            <!-- Event cards injected by renderEvents() in app.js -->
        </div>
    </main>
 
    <!-- Connect shared client script -->
    <script src="js/app.js"></script>
    <script>
        const exploreState = {
            keyword: "",
            category: "all",
            timeframe: "upcoming",
            sortBy: "date",
        };
        function handleSearch(event) {
            exploreState.keyword = event.target.value;
            renderEvents(exploreState);
        }
 
        function handleTimeframeChange(event) {
            document.querySelectorAll("#timeframe-switch .tab-btn").forEach(btn => btn.classList.remove("active"));
            event.target.classList.add("active");
            exploreState.timeframe = event.target.dataset.value;
            renderEvents(exploreState);
        }
 
        function handleCategoryChange(event) {
            document.querySelectorAll("#category-chips .chip").forEach(chip => chip.classList.remove("active"));
            event.target.classList.add("active");
            exploreState.category = event.target.dataset.value;
            renderEvents(exploreState);
        }
 
        function handleSortChange(event) {
            exploreState.sortBy = event.target.value;
            renderEvents(exploreState);
        }
        document.addEventListener("DOMContentLoaded", () => renderEvents(exploreState));
    </script>
</body>
 
</html>
